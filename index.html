<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>사격 훈련장</title><meta name="description" content="1인칭 시점으로 이동하고 조준하는 브라우저 사격 훈련 게임"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23ef5b5b' stroke-width='3'/%3E%3Cpath d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='%23ef5b5b' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><canvas id="view" aria-label="1인칭 사격 훈련장"></canvas>
<div class="hud"><div class="topbar"><div class="modes"><button data-mode="boards" class="active">사격판</button><button data-mode="dummies">이동 허수아비</button></div><div class="stats"><span>점수 <b id="score">0</b></span><span>명중률 <b id="accuracy">—</b></span><span>헤드샷 <b id="headshots">0</b></span></div><button id="settingsBtn">감도</button></div><div id="hitmark" class="hitmark">×</div><div id="message">화면을 클릭해서 시작</div><div class="ammo"><b id="ammo">12</b><span>/ ∞</span></div><div class="help">WASD 이동 · 마우스 조준 · 클릭 사격 · R 재장전 · ESC 메뉴</div></div>
<section id="panel" class="panel"><h1>사격 훈련장</h1><p id="modeText">고정된 사격판의 중앙을 맞히세요.</p><label>조준 감도 <output id="sensitivityValue">1.0</output></label><div class="sensrow"><button id="sensDown" aria-label="감도 낮추기">−</button><input id="sensitivity" aria-label="조준 감도" type="range" min="0.2" max="3" value="1" step="0.1"><button id="sensUp" aria-label="감도 높이기">＋</button></div><button id="start">훈련 시작</button><small>PC: WASD + 마우스<br>모바일: 왼쪽 이동 · 오른쪽 드래그 조준 · 화면 탭 발사</small></section>
<div id="mobile" aria-hidden="true"><div id="lookZone"></div><div class="stick" id="stick"><i></i></div><button id="reloadMobile" aria-label="재장전">↻</button><button id="fire" aria-label="탭 발사, 드래그 조준">발사</button><span class="lookHint">드래그 조준 · 탭 발사</span></div>
</main><script src="game.js"></script></body></html>
